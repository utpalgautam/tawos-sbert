experiment:
  name: problem5_sbert_cnn_within_project_random
  random_seed: 42
  project_setting: within_project
  split_strategy: random
  development_fraction: 0.80
  test_fraction: 0.20
  validation_folds: 5

data:
  raw_path: data/raw/tawos.csv
  processed_dir: data/processed
  outputs_dir: outputs
  project_column: project_id
  issue_key_column: issue_key
  title_column: title
  description_column: description_text
  target_column: story_point

sbert:
  checkpoint: sentence-transformers/all-MiniLM-L6-v2
  fine_tune: false
  expected_embedding_dim: 384
  batch_size: 64

cnn:
  conv_channels: [128, 64, 32]
  kernel_size: 3
  padding: 1
  dropout: 0.2
  output_dim: 1

training:
  loss: mse
  optimizer: adam
  learning_rate: 0.001
  batch_size: 64
  max_epochs: 100
  early_stopping_patience: 10
  early_stopping_metric: validation_mae

evaluation:
  required_metrics: [mae, mdae]
  baseline: training_median
